name: CI

on:
   push:
      branches: [v4]
   pull_request:
      branches: [v4]

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   check:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.2
         - run: bun install --frozen-lockfile
         - run: bun run typecheck
         - run: bun run lint
         - run: bun run test --ci
